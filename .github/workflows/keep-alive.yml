name: Keep Render Backend Alive

on:
  schedule:
    # Run every 14 minutes
    - cron: '*/14 * * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend
        run: |
          # Replace <YOUR_BACKEND_URL> with the actual URL of your deployed Render app
          # e.g., https://my-place-rec-backend.onrender.com
          curl -s ${{ secrets.RENDER_BACKEND_URL }}/api/places/ping/ > /dev/null
          
          # NOTE: If you don't want to use GitHub secrets, you can directly paste your URL:
          # curl -s https://<YOUR_RENDER_URL>.onrender.com/api/places/ping/ > /dev/null
